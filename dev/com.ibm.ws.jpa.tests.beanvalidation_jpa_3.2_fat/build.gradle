// Always pull from mirror so we don't have to upload transitive dependencies to artifactory
apply from: '../wlp-gradle/subprojects/maven-central-mirror.gradle'

ext {
  hibernateVersion = '7.0.9.Final'
}

configurations {
  hibernateJPA32
  jpaFatTools {
    transitive = false
  }
  requiredLibs {
    transitive = false
  }
}

dependencies {
  jpaFatTools project(':com.ibm.ws.jpa_testframework')
  requiredLibs project(":com.ibm.ws.jpa.tests.beanvalidation_fat.common")
  requiredLibs project(":com.ibm.ws.jpa.tests.beanvalidation_3.2_fat.common")

  def withoutJakartaAPI = {
      exclude group: 'jakarta.activation', module: 'jakarta.activation-api'
      exclude group: 'jakarta.inject', module: 'jakarta.inject-api'
      exclude group: 'jakarta.persistence', module: 'jakarta.persistence-api'
      exclude group: 'jakarta.transaction', module: 'jakarta.transaction-api'
      exclude group: 'jakarta.xml.bind', module: 'jakarta.xml.bind-api'
  }
    
  hibernateJPA32 "org.hibernate.orm:hibernate-core:${hibernateVersion}", withoutJakartaAPI
  hibernateJPA32 "org.hibernate.orm:hibernate-community-dialects:${hibernateVersion}", withoutJakartaAPI
  hibernateJPA32 "org.hibernate.orm:hibernate-scan-jandex:${hibernateVersion}", withoutJakartaAPI
}

task addJPAFATTools (type: Copy) {
  mustRunAfter jar
  from configurations.jpaFatTools
  include "**/com.ibm.ws.jpa_testframework.jar"
  into new File(autoFvtDir, 'lib')
}

task addhibernateJPA32(type: Copy) {
  shouldRunAfter jar
  from configurations.hibernateJPA32
  into new File(autoFvtDir, 'publish/shared/resources/jpa_beanvalidation_fat_jpa32_hibernate')
}

task copyFAT {
  def commonProject = project(':com.ibm.ws.jpa.tests.beanvalidation_fat.common')
  def common32Project = project(':com.ibm.ws.jpa.tests.beanvalidation_3.2_fat.common')
  dependsOn ':com.ibm.ws.jpa.tests.beanvalidation_fat.common:build'
  dependsOn ':com.ibm.ws.jpa.tests.beanvalidation_3.2_fat.common:build'
  doLast {
    copy {
      from commonProject.file('fat/src/com/ibm/ws/jpa/tests/beanvalidation/tests')
      into new File('fat/src/com/ibm/ws/jpa/tests/beanvalidation/tests')
    }
    copy {
      from common32Project.file('fat/src/com/ibm/ws/jpa/tests/beanvalidation/tests/jpa32')
      into new File('fat/src/com/ibm/ws/jpa/tests/beanvalidation/tests/jpa32')
    }
  }
}

task copyCommonFiles {
  def commonProject = project(':com.ibm.ws.jpa.tests.beanvalidation_fat.common')
  def common32Project = project(':com.ibm.ws.jpa.tests.beanvalidation_3.2_fat.common')
  dependsOn ':com.ibm.ws.jpa.tests.beanvalidation_fat.common:build'
  dependsOn ':com.ibm.ws.jpa.tests.beanvalidation_3.2_fat.common:build'
  doLast {
    /*
     * Copy test application resources.
     */
    copy {
      from commonProject.file('test-applications')
      into new File('test-applications')
    }

    /*
     * Copy common publish files.
     */
    copy {
      from commonProject.file('publish')
      into new File('publish')
    }

    /*
     * Copy test application resources.
     */
    copy {
      from common32Project.file('test-applications')
      into new File('test-applications')
    }
    
    /*
     * Copy common publish files.
     */
    copy {
      from common32Project.file('publish')
      into new File('publish')
    }
  }
}

addRequiredLibraries {
  dependsOn copyJdbcDrivers
  dependsOn addhibernateJPA32
  dependsOn addJakartaTransformer
  dependsOn addJPAFATTools
  dependsOn copyFAT
  dependsOn copyTestContainers
}

compileJava {
  dependsOn copyCommonFiles
  dependsOn copyFAT
}

processResources {
  dependsOn copyCommonFiles
  dependsOn copyFAT
}

autoFVT.dependsOn copyCommonFiles

clean.doLast {
  if (file('test-applications').exists()) {
    file('test-applications').deleteDir()
  }
  if (file('build').exists()) {
    file('build').deleteDir()
  }
  if (file('publish/servers').exists()) {
    file('publish/servers').deleteDir()
  }
  if (file('fat/src/com/ibm/ws/jpa/tests/beanvalidation/tests').exists()) {
    file('fat/src/com/ibm/ws/jpa/tests/beanvalidation/tests').deleteDir()
  }
}
